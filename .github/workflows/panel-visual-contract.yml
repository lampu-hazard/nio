name: Panel visual contract
on:
  push:
    paths:
      - 'apps/server/src/panels/visual/**'
      - 'apps/client/lib/panel-visual/generated/**'
      - 'scripts/sync-panel-visual.ts'
      - '.github/workflows/panel-visual-contract.yml'
  pull_request:
    paths:
      - 'apps/server/src/panels/visual/**'
      - 'apps/client/lib/panel-visual/generated/**'
      - 'scripts/sync-panel-visual.ts'
      - '.github/workflows/panel-visual-contract.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun scripts/sync-panel-visual.ts --check
