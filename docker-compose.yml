services:
  db:
    image: postgres:16-alpine
    container_name: nio-db
    restart: always
    environment:
      POSTGRES_USER: nio
      POSTGRES_PASSWORD: nio-server
      POSTGRES_DB: nio-db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nio -d nio-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  nio-migrate:
    image: ${DOCKERHUB_NAMESPACE:-lampuhazard}/nio-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: nio-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/server/.env
    environment:
      - NODE_ENV=production
    command: ["bun", "run", "prisma:deploy"]
    networks:
      - private

  nio-server:
    image: ${DOCKERHUB_NAMESPACE:-lampuhazard}/nio-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: nio-server
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
      nio-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ./apps/server/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    networks:
      - private

  nio-client:
    image: ${DOCKERHUB_NAMESPACE:-lampuhazard}/nio-client:${IMAGE_TAG:-latest}
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: nio-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - nio-server
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://nio-server:3002
    networks:
      - private

volumes:
  db_data:

networks:
  private:
    driver: bridge
