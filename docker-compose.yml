services:
  db:
    image: postgres:16-alpine
    container_name: nio-db
    restart: always
    environment:
      POSTGRES_USER: nio
      POSTGRES_PASSWORD: nio-server
      POSTGRES_DB: nio-db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nio -d nio-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  searxng:
    image: searxng/searxng:latest
    container_name: nio-searxng
    restart: unless-stopped
    volumes:
      - ./services/searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    networks:
      - private

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: nio-firecrawl-playwright
    restart: unless-stopped
    shm_size: 1g
    environment:
      - PORT=3000
      - MAX_CONCURRENT_PAGES=${FIRECRAWL_MAX_CONCURRENT_PAGES:-5}
    networks:
      - private

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: nio-firecrawl-nuq-db
    restart: unless-stopped
    command: ["postgres", "-c", "cron.log_run=off", "-c", "cron.log_statement=off"]
    environment:
      - POSTGRES_USER=${NUQ_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${NUQ_POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${NUQ_POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NUQ_POSTGRES_USER:-postgres} -d ${NUQ_POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nio-firecrawl-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - private

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: nio-firecrawl
    restart: unless-stopped
    command: ["node", "dist/src/harness.js", "--start-docker"]
    depends_on:
      redis:
        condition: service_healthy
      playwright-service:
        condition: service_started
      nuq-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - INTERNAL_PORT=3002
      - EXTRACT_WORKER_PORT=3004
      - WORKER_PORT=3005
      - ENV=local
      - USE_DB_AUTHENTICATION=false
      - HARNESS_STARTUP_TIMEOUT_MS=${FIRECRAWL_STARTUP_TIMEOUT_MS:-180000}
      - NUQ_WORKER_COUNT=${FIRECRAWL_NUQ_WORKER_COUNT:-1}
      - NUM_WORKERS_PER_QUEUE=${FIRECRAWL_NUM_WORKERS_PER_QUEUE:-2}
      - CRAWL_CONCURRENT_REQUESTS=${FIRECRAWL_CONCURRENT_REQUESTS:-5}
      - MAX_CONCURRENT_JOBS=${FIRECRAWL_MAX_CONCURRENT_JOBS:-2}
      - BROWSER_POOL_SIZE=${FIRECRAWL_BROWSER_POOL_SIZE:-2}
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000/scrape
      - NUQ_DATABASE_URL=postgresql://${NUQ_POSTGRES_USER:-postgres}:${NUQ_POSTGRES_PASSWORD:-postgres}@nuq-postgres:5432/${NUQ_POSTGRES_DB:-postgres}
      - POSTGRES_USER=${NUQ_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${NUQ_POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${NUQ_POSTGRES_DB:-postgres}
      - POSTGRES_HOST=nuq-postgres
      - POSTGRES_PORT=5432
      - NUQ_RABBITMQ_URL=amqp://rabbitmq:5672
      - BULL_AUTH_KEY=${FIRECRAWL_BULL_AUTH_KEY:-nio-firecrawl-bull-key}
      - TEST_API_KEY=${FIRECRAWL_API_KEY:-}
      - SEARXNG_ENDPOINT=http://searxng:8080
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - private

  nio-migrate:
    image: ${GHCR_NAMESPACE:-ghcr.io/lampu-hazard}/nio-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: nio-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/server/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://nio:nio-server@db:5432/nio-db}
    command: ["bun", "run", "prisma:deploy"]
    networks:
      - private

  nio-server:
    image: ${GHCR_NAMESPACE:-ghcr.io/lampu-hazard}/nio-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: nio-server
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
      nio-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ./apps/server/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://nio:nio-server@db:5432/nio-db}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - FIRECRAWL_URL=${FIRECRAWL_URL:-http://firecrawl:3002}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
    networks:
      - private

  nio-client:
    image: ${GHCR_NAMESPACE:-ghcr.io/lampu-hazard}/nio-client:${IMAGE_TAG:-latest}
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: nio-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - nio-server
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://nio-server:3002
    networks:
      - private

volumes:
  db_data:

networks:
  private:
    driver: bridge
