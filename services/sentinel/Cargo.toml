[package]
name = "nio-sentinel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.17", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1.25"
deunicode = "1.6.2"
regex = "1.10"

[build-dependencies]
napi-build = "2.4.4"
